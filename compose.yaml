services:
  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: pulse_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pulse_dev

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_dev -d pulse_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
